name: Verify ExamForge foundation

on:
  push:
    branches:
      - "foundation/**"
    paths:
      - "src/**"
      - "tests/**"
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "tests/setup-local-supabase.mjs"
      - ".github/workflows/verify-foundation.yml"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "vite.config.ts"
      - "tsconfig*.json"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "supabase/migrations/**"
      - ".github/workflows/verify-foundation.yml"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "vite.config.ts"
      - "tsconfig*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: examforge-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: examforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d examforge_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Verify learner-subject migration and RLS in disposable PostgreSQL
        run: psql -h localhost -U postgres -d examforge_test -v ON_ERROR_STOP=1 -f tests/sql/learner-subjects-rls.sql
        env:
          PGPASSWORD: postgres
      - name: Verify recoverable study session and answer RLS in disposable PostgreSQL
        run: psql -h localhost -U postgres -d examforge_test -v ON_ERROR_STOP=1 -f tests/sql/recoverable-study-sessions.sql
        env:
          PGPASSWORD: postgres
      - name: Start disposable local Supabase
        uses: supabase/setup-cli@v1
        with:
          version: 2.39.2
      - name: Apply migrations to disposable local Supabase
        run: |
          supabase start --exclude studio,edge-runtime,logflare,vector,imgproxy,inbucket,analytics
          supabase status -o env >> "$GITHUB_ENV"
      - name: Create disposable local learner accounts
        run: node tests/setup-local-supabase.mjs
        env:
          API_URL: ${{ env.API_URL }}
          SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
      - name: TypeScript and production build
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run browser and integration tests, including local Supabase auth and recovery
        run: npx playwright test --workers=1
        env:
          VITE_SUPABASE_URL: ${{ env.API_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          SUPABASE_IS_DISPOSABLE_STAGING: "true"
          RUN_LIVE_SUPABASE_E2E: "true"
          E2E_TEST_EMAIL_A: learner-a@examforge.local
          E2E_TEST_PASSWORD_A: ExamForgeLocalTest-A!2026
          E2E_TEST_EMAIL_B: learner-b@examforge.local
          E2E_TEST_PASSWORD_B: ExamForgeLocalTest-B!2026
