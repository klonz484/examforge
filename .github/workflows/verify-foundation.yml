name: Verify ExamForge foundation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "supabase/functions/**"
      - "tests/setup-local-supabase.mjs"
      - ".github/workflows/verify-foundation.yml"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "vite.config.ts"
      - "tsconfig*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: examforge-foundation-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: examforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d examforge_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client tesseract-ocr tesseract-ocr-eng tesseract-ocr-afr poppler-utils imagemagick
      - name: Verify isolated Tesseract OCR worker with synthetic image only
        run: npm run test:ocr-worker
      - name: Verify learner-subject migration and RLS in disposable PostgreSQL
        run: psql -h localhost -U postgres -d examforge_test -v ON_ERROR_STOP=1 -f tests/sql/learner-subjects-rls.sql
        env:
          PGPASSWORD: postgres
      - name: Verify recoverable study session and answer RLS in disposable PostgreSQL
        run: psql -h localhost -U postgres -d examforge_test -v ON_ERROR_STOP=1 -f tests/sql/recoverable-study-sessions.sql
        env:
          PGPASSWORD: postgres
      - name: Verify spaced-repetition scheduling and RLS in disposable PostgreSQL
        run: psql -h localhost -U postgres -d examforge_test -v ON_ERROR_STOP=1 -f tests/sql/flashcard-reviews.sql
        env:
          PGPASSWORD: postgres
      - name: Verify AI quota accounting and RLS in disposable PostgreSQL
        run: psql -h localhost -U postgres -d examforge_test -v ON_ERROR_STOP=1 -f tests/sql/ai-study-usage.sql
        env:
          PGPASSWORD: postgres
      - name: Verify disposable PostgreSQL backup restoration
        run: |
          pg_dump -h localhost -U postgres -d examforge_test --format=custom --no-owner --no-acl --file "$RUNNER_TEMP/examforge-test.dump"
          createdb -h localhost -U postgres examforge_restore_test
          pg_restore -h localhost -U postgres -d examforge_restore_test --no-owner --no-acl --exit-on-error "$RUNNER_TEMP/examforge-test.dump"
          psql -h localhost -U postgres -d examforge_restore_test -v ON_ERROR_STOP=1 -f tests/sql/backup-restore-check.sql
        env:
          PGPASSWORD: postgres
      - name: Start disposable local Supabase
        uses: supabase/setup-cli@v1
        with:
          version: 2.39.2
      - name: Apply migrations to disposable local Supabase
        run: |
          supabase start --exclude studio,logflare,vector,imgproxy,inbucket,analytics
          eval "$(supabase status -o env)"
          {
            echo "API_URL=$API_URL"
            echo "SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_IS_DISPOSABLE_STAGING=true"
            echo "RUN_LIVE_SUPABASE_E2E=true"
            echo "E2E_TEST_EMAIL_A=learner-a@examforge.local"
            echo "E2E_TEST_PASSWORD_A=ExamForgeLocalTest-A!2026"
            echo "E2E_TEST_EMAIL_B=learner-b@examforge.local"
            echo "E2E_TEST_PASSWORD_B=ExamForgeLocalTest-B!2026"
            echo "E2E_TEST_EMAIL_C=learner-c@examforge.local"
            echo "E2E_TEST_PASSWORD_C=ExamForgeLocalTest-C!2026"
          } >> "$GITHUB_ENV"
      - name: Create disposable local learner accounts
        run: node tests/setup-local-supabase.mjs

      - name: Serve local Edge Functions with no AI provider secrets
        run: |
          eval "$(supabase status -o env)"
          cat > "$RUNNER_TEMP/functions.env" <<EOF
          SUPABASE_URL=$API_URL
          SUPABASE_ANON_KEY=$ANON_KEY
          SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY
          AI_STUDY_ENABLED=false
          OCR_WORKER_ENABLED=false
          AI_ALLOWED_ORIGINS=http://127.0.0.1:4173
          EOF
          if grep -E 'AI_STUDY_(API_KEY|ENDPOINT|MODEL)=' "$RUNNER_TEMP/functions.env"; then echo "Provider credentials must be absent in non-production CI."; exit 1; fi
          supabase functions serve --env-file "$RUNNER_TEMP/functions.env" --no-verify-jwt > "$RUNNER_TEMP/functions.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/functions.pid"
          for attempt in $(seq 1 45); do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST \
              -H 'Content-Type: application/json' --data '{}' \
              "$API_URL/functions/v1/extract-study-note" || true)"
            if [ "$code" = "401" ]; then
              echo "Local extraction function is serving; provider secrets are intentionally absent."
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/functions.log"
          exit 1
      - name: Prove live AI provider calls are disabled in test configuration
        run: |
          code="$(curl --silent --output "$RUNNER_TEMP/ai-disabled.json" --write-out '%{http_code}' -X POST \
            -H "Authorization: Bearer $VITE_SUPABASE_ANON_KEY" \
            -H "apikey: $VITE_SUPABASE_ANON_KEY" \
            -H 'Content-Type: application/json' --data '{}' \
            "$API_URL/functions/v1/generate-study-question")"
          if [ "$code" != "503" ] || ! grep -q "disabled pending explicit" "$RUNNER_TEMP/ai-disabled.json"; then
            echo "Expected the AI kill switch to return HTTP 503 with its explicit disabled message; received HTTP $code."
            cat "$RUNNER_TEMP/ai-disabled.json"
            echo "--- Edge Function logs ---"
            cat "$RUNNER_TEMP/functions.log"
            exit 1
          fi
          ! grep -q "AI_STUDY_API_KEY" "$RUNNER_TEMP/functions.env"
          ! grep -q "OPENAI_API_KEY" "$RUNNER_TEMP/functions.env"
          echo "AI provider kill switch returned 503 and no provider credentials are present."

      - name: TypeScript and production build
        run: npm run build
      - name: Enforce compressed bundle budgets
        run: npm run check:bundle
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run browser and integration tests, including local Supabase auth and recovery
        run: npx playwright test --workers=1
