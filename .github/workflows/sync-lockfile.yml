name: Synchronize ExamForge lockfile

on:
  push:
    branches:
      - feat/adopt-shared-ui-library
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/sync-lockfile.yml"

permissions:
  contents: write

concurrency:
  group: examforge-lockfile-sync
  cancel-in-progress: false

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/adopt-shared-ui-library
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Regenerate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Prove clean reproducible install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify production build
        run: npm run build
      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): synchronize npm lockfile"
          git push origin HEAD:feat/adopt-shared-ui-library
