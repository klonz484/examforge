name: Validate contribution workflow

on:
  pull_request:
    paths:
      - 'docs/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/workflows/contribution-check.yml'
      - 'scripts/validate-contribution-system.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate contribution templates and documentation
        run: node scripts/validate-contribution-system.mjs
