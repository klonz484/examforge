name: Verify feature branch
on:
  push:
    branches:
      - 'feat/**'
  workflow_dispatch:

concurrency:
  group: feature-verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: TypeScript and production build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Catalogue and onboarding browser tests
        run: npx playwright test tests/e2e/capsSubjects.spec.ts tests/e2e/learnerSubjectsMigration.spec.ts tests/e2e/smoke.spec.ts
