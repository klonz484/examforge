name: Verify shared UI adoption

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/e2e/**"
      - ".github/workflows/verify-shared-ui.yml"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/e2e/**"
      - ".github/workflows/verify-shared-ui.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify UI consumer journeys
        run: npx playwright test tests/e2e/smoke.spec.ts tests/e2e/shared-ui.spec.ts
