name: Verify shared UI adoption
# Lockfile is synchronized; npm ci is now the required reproducible install.

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/e2e/**"
      - ".github/workflows/verify-shared-ui.yml"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/e2e/**"
      - ".github/workflows/verify-shared-ui.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify UI consumer journeys
        run: npx playwright test tests/e2e/smoke.spec.ts tests/e2e/shared-ui.spec.ts tests/e2e/supabase.spec.ts
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          E2E_TEST_EMAIL_A: ${{ secrets.E2E_TEST_EMAIL_A }}
          E2E_TEST_PASSWORD_A: ${{ secrets.E2E_TEST_PASSWORD_A }}
          E2E_TEST_EMAIL_B: ${{ secrets.E2E_TEST_EMAIL_B }}
          E2E_TEST_PASSWORD_B: ${{ secrets.E2E_TEST_PASSWORD_B }}
      - name: Commit synchronized lockfile to this pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): synchronize npm lockfile"
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"
